version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Node version:" && node --version
        - echo "npm version:" && npm --version
        - echo "Installing dependencies..."
    build:
      commands:
        - npm ci --legacy-peer-deps
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
