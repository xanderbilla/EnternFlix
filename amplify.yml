version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Loading version from .version.${AMPLIFY_ENV:=dev}..."
        - |
          # Load environment based on AMPLIFY_ENV
          if [ "$AMPLIFY_ENV" = "prod" ]; then
            VERSION=$(cat .version.prod 2>/dev/null || echo "0.0.0")
            # Production overrides
            export NODE_ENV=production
            export NEXT_PUBLIC_APP_ENV=prod
            export NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://your-domain.com}
            export NEXT_PUBLIC_CUSTOM_API_URL=${NEXT_PUBLIC_CUSTOM_API_URL:-https://api.yourdomain.com/v1}
          else
            VERSION=$(cat .version.dev 2>/dev/null || echo "0.0.0")
            # Development defaults
            export NODE_ENV=development
            export NEXT_PUBLIC_APP_ENV=dev
            export NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
            export NEXT_PUBLIC_CUSTOM_API_URL=${NEXT_PUBLIC_CUSTOM_API_URL:-http://localhost:8080/v1}
          fi

          # Set version from .version file
          export NEXT_PUBLIC_APP_VERSION="v${VERSION}"

          # Set defaults for other env vars if not already set
          export NODE_ENV=${NODE_ENV:-development}
          export PORT=${PORT:-3000}
          export HOSTNAME=${HOSTNAME:-0.0.0.0}
          export NEXT_PUBLIC_ENABLE_LOGGING=${NEXT_PUBLIC_ENABLE_LOGGING:-true}
          export NEXT_PUBLIC_HTTP_TIMEOUT_MS=${NEXT_PUBLIC_HTTP_TIMEOUT_MS:-10000}
          export NEXT_PUBLIC_CUSTOM_IMAGE_BASE_URL=${NEXT_PUBLIC_CUSTOM_IMAGE_BASE_URL:-https://bi8s-storage-dev.s3.us-east-1.amazonaws.com/}
          export NEXT_PUBLIC_IMAGE_HOSTS=${NEXT_PUBLIC_IMAGE_HOSTS:-}

          echo "Version: $NEXT_PUBLIC_APP_VERSION"
          echo "Environment: $NEXT_PUBLIC_APP_ENV"
          echo "Site URL: $NEXT_PUBLIC_SITE_URL"
          echo "API URL: $NEXT_PUBLIC_CUSTOM_API_URL"
    build:
      commands:
        - npm ci
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
